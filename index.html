
<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samad Solar</title>
  
  <style>
    * { box-sizing: border-box; }
<!-- STOCK SECTION -->
<div class="container">

  <h2>📦 Stock / محصولات</h2>

  <div class="card">
    <input id="productName" type="text" placeholder="د محصول نوم">

    <input id="productCode" type="text" placeholder="Product Code">

    <input id="buyPrice" type="number" placeholder="Buying Price">

    <input id="productQty" type="number" placeholder="Quantity">

    <input id="lowLimit" type="number" placeholder="Low Stock Limit">

    <button onclick="addProduct()">➕ Add Product</button>
  </div>

  <div id="stockList"></div>

</div>

<script>
function addProduct() {

  const name = document.getElementById("productName").value;
  const code = document.getElementById("productCode").value;
  const price = document.getElementById("buyPrice").value;
  const qty = document.getElementById("productQty").value;
  const limit = document.getElementById("lowLimit").value;

  if (!name || !qty) {
    alert("د محصول نوم او Quantity ولیکئ");
    return;
  }

  const products = JSON.parse(
    localStorage.getItem("samadProducts") || "[]"
  );

  products.push({
    name: name,
    code: code,
    buyPrice: Number(price),
    quantity: Number(qty),
    lowLimit: Number(limit 0)
  <p>Low Stock Limit: ${p.lowLimit}</p>
  });

  localStorage.setItem("samadProducts", JSON.stringify(products));

  document.getElementById("productName").value = "";
  document.getElementById("productCode").value = "";
  document.getElementById("buyPrice").value = "";
  document.getElementById("productQty").value = "";
  document.getElementById("lowLimit").value = "";

  showProducts();
}

function showProducts() {

  const products = JSON.parse(
    localStorage.getItem("samadProducts") || "[]"
  );

  const list = document.getElementById("stockList");

  list.innerHTML = "";

  products.forEach((p, index) => {

    const low =
      p.quantity <= p.lowLimit
        ? "⚠️ Low Stock"
        : "✅ In Stock";

    list.innerHTML += `
      <div class="card">
        <h3>${p.name}</h3>
        <p>Code: ${p.code || "-"}</p>
        <p>Buying Price: ${p.buyPrice}</p>
        <p>Quantity: ${p.quantity}</p>
        <p>${low}</p>
      </div>
    `;
  });
}

showProducts();
</script>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
    }

    .settings, .section, .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      text-align: center;
      margin-top: 0;
    }

    .card h2 { color: #0f766e; }

    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    button {
      background: #0f766e;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover { background: #115e59; }

    #message {
      color: #0f766e;
      font-weight: bold;
    }

    .product {
      border-bottom: 1px solid #ddd;
      padding: 12px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<header>
  <h1 id="appTitle">☀️ Samad Solar</h1>
  <p id="appSubtitle">د سولر دوکان د مدیریت سیستم</p>
</header>

<div class="container">

  <<div class="cards">

  <div class="card">
    <h3>💰 سرمایه</h3>
    <h2 id="capital">0 AFN</h2>
  </div>

  <div class="card">
    <h3>📦 Stock</h3>
    <h2 id="stock">0</h2>
  </div>

  <div class="card">
    <h3>🛒 Purchase</h3>
    <h2 id="purchase">0</h2>
  </div>

  <div class="card">
    <h3>💵 Sale</h3>
    <h2 id="sale">0</h2>
  </div>

  <div class="card">
    <h3>💸 Expenses</h3>
    <h2 id="expenses">0</h2>
  </div>

  <div class="card">
    <h3>📊 Profit / Loss</h3>
    <h2 id="profit">0</h2>
  </div>

</div>!-- ژبه او کرنسي -->
  <div class="settings">
    <h2 id="settingsTitle">تنظیمات</h2>

    <label id="languageLabel">ژبه / Language</label>
    <select id="language" onchange="changeLanguage()">
      <option value="ps">پښتو</option>
      <option value="fa">دری</option>
      <option value="en">English</option>
    </select>

    <label id="currencyLabel">کرنسي / Currency</label>
    <select id="currency" onchange="changeCurrency()">
      <option value="AFN">AFN - افغانۍ</option>
      <option value="USD">USD - Dollar</option>
      <option value="Rs">Rs - Rupee</option>
    </select>

    <p id="selectedCurrency"></p>
  </div>

  <!-- معلومات -->
  <div class="cards">
    <div class="card">
      <h3 id="productsTitle">ټول محصولات</h3>
      <h2 id="productCount">0</h2>
    </div>

    <div class="card">
      <h3 id="salesTitle">ټولې خرڅلاوې</h3>
      <h2 id="salesCount">0</h2>
    </div>

    <div class="card">
      <h3 id="currencyTitle">کرنسي</h3>
      <h2 id="currencyDisplay">AFN</h2>
    </div>
  </div>

  <!-- محصول -->
  <div class="section">
    <h2 id="addProductTitle">نوی محصول اضافه کړه</h2>

    <input id="productName" placeholder="د محصول نوم">
    <input id="productPrice" type="number" placeholder="نرخ">
    <input id="productQuantity" type="number" placeholder="تعداد">

    <button id="saveButton" onclick="addProduct()">محصول Save کړه</button>

    <p id="message"></p>
  </div>

  <!-- لېست -->
  <div class="section">
    <h2 id="listTitle">د محصولاتو لېست</h2>
    <div id="productList">تر اوسه محصول نشته.</div>
  </div>

</div>

<script>
  let products = JSON.parse(localStorage.getItem("samadProducts")) || [];

  let currentLanguage =
    localStorage.getItem("samadLanguage") || "ps";

  let currentCurrency =
    localStorage.getItem("samadCurrency") || "AFN";

  const translations = {
    ps: {
      dir: "rtl",
      subtitle: "د سولر دوکان د مدیریت سیستم",
      settings: "تنظیمات",
      language: "ژبه",
      currency: "کرنسي",
      products: "ټول محصولات",
      sales: "ټولې خرڅلاوې",
      addProduct: "نوی محصول اضافه کړه",
      save: "محصول Save کړه",
      list: "د محصولاتو لېست",
      name: "د محصول نوم",
      price: "نرخ",
      quantity: "تعداد",
      empty: "تر اوسه محصول نشته.",
      success: "محصول په بریالیتوب سره Save شو.",
      error: "مهرباني وکړئ ټول معلومات ولیکئ."
    },

    fa: {
      dir: "rtl",
      subtitle: "سیستم مدیریت فروشگاه سولر",
      settings: "تنظیمات",
      language: "زبان",
      currency: "واحد پول",
      products: "تمام محصولات",
      sales: "تمام فروش‌ها",
      addProduct: "افزودن محصول جدید",
      save: "ذخیره محصول",
      list: "لیست محصولات",
      name: "نام محصول",
      price: "قیمت",
      quantity: "تعداد",
      empty: "هنوز محصولی وجود ندارد.",
      success: "محصول با موفقیت ذخیره شد.",
      error: "لطفاً تمام معلومات را وارد کنید."
    },

    en: {
      dir: "ltr",
      subtitle: "Solar Shop Management System",
      settings: "Settings",
      language: "Language",
      currency: "Currency",
      products: "Total Products",
      sales: "Total Sales",
      addProduct: "Add New Product",
      save: "Save Product",
      list: "Product List",
      name: "Product Name",
      price: "Price",
      quantity: "Quantity",
      empty: "No products yet.",
      success: "Product saved successfully.",
      error: "Please fill in all fields."
    }
  };

  function t(key) {
    return translations[currentLanguage][key];
  }

  function applyLanguage() {
    const language = translations[currentLanguage];

    document.documentElement.lang = currentLanguage;
    document.documentElement.dir = language.dir;

    document.getElementById("appSubtitle").textContent =
      language.subtitle;

    document.getElementById("settingsTitle").textContent =
      language.settings;

    document.getElementById("languageLabel").textContent =
      language.language;

    document.getElementById("currencyLabel").textContent =
      language.currency;

    document.getElementById("productsTitle").textContent =
      language.products;

    document.getElementById("salesTitle").textContent =
      language.sales;

    document.getElementById("addProductTitle").textContent =
      language.addProduct;

    document.getElementById("saveButton").textContent =
      language.save;

    document.getElementById("listTitle").textContent =
      language.list;

    document.getElementById("productName").placeholder =
      language.name;

    document.getElementById("productPrice").placeholder =
      language.price;

    document.getElementById("productQuantity").placeholder =
      language.quantity;

    document.getElementById("currencyTitle").textContent =
      language.currency;

    document.getElementById("language").value =
      currentLanguage;

    document.getElementById("currency").value =
      currentCurrency;

    document.getElementById("currencyDisplay").textContent =
      currentCurrency;

    document.getElementById("selectedCurrency").textContent =
      language.currency + ": " + currentCurrency;

    showProducts();
  }

  function changeLanguage() {
    currentLanguage =
      document.getElementById("language").value;

    localStorage.setItem("samadLanguage", currentLanguage);

    applyLanguage();
  }

  function changeCurrency() {
    currentCurrency =
      document.getElementById("currency").value;

    localStorage.setItem("samadCurrency", currentCurrency);

    applyLanguage();
  }

  function saveData() {
    localStorage.setItem(
      "samadProducts",
      JSON.stringify(products)
    );
  }

  function addProduct() {
    const name =
      document.getElementById("productName").value.trim();

    const price =
      document.getElementById("productPrice").value;

    const quantity =
      document.getElementById("productQuantity").value;

    if (!name || !price || !quantity) {
      document.getElementById("message").textContent =
        t("error");
      return;
    }

    products.push({
      name: name,
      price: Number(price),
      quantity: Number(quantity),
      currency: currentCurrency
    });

    saveData();
    showProducts();

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productQuantity").value = "";

    document.getElementById("message").textContent =
      t("success");
  }

  function showProducts() {
    document.getElementById("productCount").textContent =
      products.length;

    if (products.length === 0) {
      document.getElementById("productList").textContent =
        t("empty");
      return;
    }

    document.getElementById("productList").innerHTML =
      products.map((product, index) => `
        <div class="product">
          <b>${index + 1}. ${product.name}</b><br>
          ${t("price")}: ${product.price} ${product.currency}<br>
          ${t("quantity")}: ${product.quantity}
        </div>
      `).join("");
  }

  applyLanguage();
</script>

</body>
</html>
